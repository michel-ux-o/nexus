plugins {
    id 'com.android.application'
}

// A release is bound to one hosted deployment. No address is accepted from the UI.
def nexusOrigin = providers.gradleProperty('nexusOrigin').orElse('').get().trim()
def originIsValid = false
if (nexusOrigin) {
    try {
        def uri = new URI(nexusOrigin)
        originIsValid = uri.scheme == 'https' &&
                uri.host != null && uri.host == uri.host.toLowerCase(Locale.ROOT) &&
                uri.host.matches('[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\\.onrender\\.com') &&
                uri.port == -1 && !uri.userInfo && !uri.rawQuery && !uri.rawFragment &&
                (!uri.rawPath || uri.rawPath == '/')
        if (originIsValid) nexusOrigin = "https://${uri.host}"
    } catch (URISyntaxException ignored) {
        originIsValid = false
    }
    if (!originIsValid) throw new GradleException('nexusOrigin must be one exact HTTPS *.onrender.com origin without credentials, port, path, query or fragment.')
}

def signingValues = [
        path: providers.environmentVariable('NEXUS_KEYSTORE_PATH').orElse('').get(),
        storePassword: providers.environmentVariable('NEXUS_KEYSTORE_PASSWORD').orElse('').get(),
        alias: providers.environmentVariable('NEXUS_KEY_ALIAS').orElse('').get(),
        keyPassword: providers.environmentVariable('NEXUS_KEY_PASSWORD').orElse('').get()
]
def hasReleaseSigning = signingValues.values().every { !it.isEmpty() }

android {
    namespace 'de.nexus.app'
    compileSdk 36

    defaultConfig {
        applicationId 'de.nexus.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '3.0.0'
        buildConfigField 'String', 'NEXUS_ORIGIN', '"' + nexusOrigin + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingValues.path)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            debuggable false
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

def validateReleaseConfiguration = tasks.register('validateReleaseConfiguration') {
    doLast {
        if (!originIsValid) throw new GradleException('Release requires -PnexusOrigin=https://<deployment>.onrender.com.')
        if (!hasReleaseSigning) throw new GradleException('Release requires NEXUS_KEYSTORE_PATH, NEXUS_KEYSTORE_PASSWORD, NEXUS_KEY_ALIAS and NEXUS_KEY_PASSWORD in the environment.')
        if (!file(signingValues.path).isFile()) throw new GradleException('The external release keystore does not exist.')
        def signingPath = file(signingValues.path).canonicalPath
        def sourcePath = rootProject.projectDir.canonicalPath + File.separator
        if (signingPath.startsWith(sourcePath)) throw new GradleException('Keep the release keystore outside android/ (for example in the ignored .work directory).')
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') dependsOn validateReleaseConfiguration
}
